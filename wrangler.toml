name = "binnacle"
main = "worker.ts"
compatibility_date = "2024-12-01"

# Routing, declared as code so the Git-connected build is authoritative
# (the dashboard toggles lock out for git-deployed workers).
workers_dev = true
routes = [
  { pattern = "binnacle.dort.zone", custom_domain = true },
]

# D1 database. Create it once with:
#   npx wrangler@latest d1 create binnacle
# then paste the returned database_id below (and commit it — it is not a secret).
[[d1_databases]]
binding = "DB"
database_name = "binnacle"
database_id = "45d1f082-5f10-4a88-90c0-c35b8aa24fda"

# --- Optional: isolate full-document artifacts on a separate origin -----------
# By default, artifacts render in a sandboxed same-origin iframe (their scripts
# run, but localStorage is disabled and they cannot touch the reader). To restore
# localStorage-backed persistence AND keep real isolation, serve artifacts from a
# sibling subdomain so they run cross-origin to the reader:
#   1. Add the custom-domain route (provisions DNS + cert on deploy):
# [[routes]]
# pattern = "raw.binnacle.dort.zone"
# custom_domain = true
#   2. Point the worker at both origins:
# [vars]
# RAW_ORIGIN = "https://raw.binnacle.dort.zone"
# READER_ORIGIN = "https://binnacle.dort.zone"
# ------------------------------------------------------------------------------

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true
