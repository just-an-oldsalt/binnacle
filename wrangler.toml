name = "binnacle"
main = "worker.ts"
compatibility_date = "2024-12-01"

# Every fresh deploy is reachable at https://binnacle.<your-subdomain>.workers.dev
# out of the box — no domain, no DNS, no cost. `npm run setup` wires up the rest.
workers_dev = true

# --- Optional: serve the reader from your own domain --------------------------
# Uncomment and set your hostname to attach a custom domain. Cloudflare
# provisions the DNS record + TLS cert on the next deploy. You must own the zone
# in this Cloudflare account.
# routes = [
#   { pattern = "binnacle.example.com", custom_domain = true },
# ]
# ------------------------------------------------------------------------------

# D1 database. `npm run setup` creates it and writes the id below for you. To do
# it by hand: `npx wrangler d1 create binnacle`, then paste the returned id here.
# The id is not a secret — it is safe to commit.
[[d1_databases]]
binding = "DB"
database_name = "binnacle"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# --- Optional: isolate full-document artifacts on a separate origin -----------
# By default, artifacts render in a sandboxed same-origin iframe (their scripts
# run, but localStorage is disabled and they cannot touch the reader). To restore
# localStorage-backed persistence AND keep real isolation, serve artifacts from a
# sibling subdomain so they run cross-origin to the reader:
#   1. Add the custom-domain route (provisions DNS + cert on deploy):
# [[routes]]
# pattern = "raw.binnacle.example.com"
# custom_domain = true
#   2. Point the worker at both origins:
# [vars]
# RAW_ORIGIN = "https://raw.binnacle.example.com"
# READER_ORIGIN = "https://binnacle.example.com"
# ------------------------------------------------------------------------------

[observability]
enabled = true

[observability.logs]
enabled = true
persist = true
invocation_logs = true
